<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Task Manager</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">🌙</button>
    </header>

    <!-- New / edit task form -->
    <form id="task-form" class="task-form" autocomplete="off">
      <input type="hidden" id="task-id" />
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="What needs doing?" required />
      </div>

      <div class="field">
        <label for="description">Description <span class="optional">(optional)</span></label>
        <textarea id="description" rows="2" placeholder="Add details…"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="due-date">Due date</label>
          <input type="date" id="due-date" />
        </div>
        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-btn" class="btn btn-primary">Add task</button>
        <button type="button" id="cancel-btn" class="btn btn-ghost hidden">Cancel</button>
      </div>
    </form>

    <!-- Filters -->
    <div class="filters">
      <div class="filter-group" role="group" aria-label="Filter by status">
        <button class="filter-btn active" data-filter-type="status" data-filter="all">All</button>
        <button class="filter-btn" data-filter-type="status" data-filter="active">Active</button>
        <button class="filter-btn" data-filter-type="status" data-filter="completed">Completed</button>
      </div>
      <div class="filter-group" role="group" aria-label="Filter by priority">
        <label for="priority-filter" class="sr-only">Filter by priority</label>
        <select id="priority-filter">
          <option value="all">All priorities</option>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
      </div>
    </div>

    <!-- Task list -->
    <ul id="task-list" class="task-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty-state hidden">No tasks here. Add one above! ✨</p>

    <footer class="app-footer">
      <span id="task-count">0 tasks</span>
      <button id="clear-completed" class="btn btn-ghost">Clear completed</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
